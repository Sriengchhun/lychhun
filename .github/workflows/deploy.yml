name: Deploy invitation to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm ci
      - name: Build invitation
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "${PAGES_BASE_PATH:-/}"
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          path: dist
      - name: Wait for GitHub to list the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in {1..10}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[].id' | grep -Fx "$PAGES_ARTIFACT_ID"; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::The uploaded Pages artifact did not appear in the workflow run."
          exit 1
      - uses: actions/deploy-pages@v5
        id: deployment
